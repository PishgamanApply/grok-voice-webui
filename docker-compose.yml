version: '3.8'

services:
  grok-voice-app:
    build: .
    container_name: grok-voice-agent
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - XAI_API_KEY=${XAI_API_KEY}
      - XAI_AGENT_ID=${XAI_AGENT_ID:-agent_zUSPneIFwL9LP1Kn}
    env_file:
      - .env
